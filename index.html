/* Layout: app shell = side menu (drawer on phones, fixed rail on wide screens) + top bar + one centred column + bottom tab bar on phones. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#0F1F1B; --ink-2:#3E4C48; --muted:#5C6964; --line:#DAE1DE;
  --brand:#0E5A4C; --brand-ink:#FFFFFF; --brand-soft:#DCEFE9;
  --get:#0E5A4C; --get-soft:#DCEFE9;
  --owe:#B04E09; --owe-soft:#FBE8D8;
  --fam:#7A3E8E; --fam-soft:#F2E7F6;
  --inc:#1D62AD; --inc-soft:#E1ECF8;
  --warn:#B42318; --warn-soft:#FDE6E3;
  --hero:#0B3D35; --hero-fg:#F2FFFB; --hero-muted:#A8D0C5; --hero-line:rgba(255,255,255,.07); --margin-line:#E9A15B;
  --scrim:rgba(8,20,17,.45); --shadow:0 1px 2px rgba(15,31,27,.06), 0 6px 18px rgba(15,31,27,.06);
  --f-display:'Bricolage Grotesque Variable','Bricolage Grotesque',ui-rounded,system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans Variable','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1311; --surface:#131D1A; --surface-2:#192421; --ink:#E7F0EC; --ink-2:#BAC7C2; --muted:#93A29C; --line:#25332F;
  --brand:#52C4A7; --brand-ink:#05241E; --brand-soft:#123A31;
  --get:#52C4A7; --get-soft:#123A31;
  --owe:#F4A464; --owe-soft:#3A2715;
  --fam:#D7A1E8; --fam-soft:#2F1E37;
  --inc:#82B5F1; --inc-soft:#16273C;
  --warn:#FF8B7B; --warn-soft:#3B1A15;
  --hero:#0F2E28; --hero-fg:#EFFFFA; --hero-muted:#9CC8BC; --hero-line:rgba(255,255,255,.05); --margin-line:#C98545;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1311; --surface:#131D1A; --surface-2:#192421; --ink:#E7F0EC; --ink-2:#BAC7C2; --muted:#93A29C; --line:#25332F;
  --brand:#52C4A7; --brand-ink:#05241E; --brand-soft:#123A31;
  --get:#52C4A7; --get-soft:#123A31;
  --owe:#F4A464; --owe-soft:#3A2715;
  --fam:#D7A1E8; --fam-soft:#2F1E37;
  --inc:#82B5F1; --inc-soft:#16273C;
  --warn:#FF8B7B; --warn-soft:#3B1A15;
  --hero:#0F2E28; --hero-fg:#EFFFFA; --hero-muted:#9CC8BC; --hero-line:rgba(255,255,255,.05); --margin-line:#C98545;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{min-height:100%}
.side{position:fixed;top:0;bottom:0;left:0;width:288px;max-width:86vw;background:var(--surface);border-right:1px solid var(--line);z-index:30;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));overflow-y:auto}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:25}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 16px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--hero);display:flex;align-items:center;justify-content:center;flex:none}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;display:block;line-height:1.1}
.brand small{font-size:12px;color:var(--muted);font-weight:600}
.menu-group{display:flex;flex-direction:column;gap:2px;padding:8px 0}
.menu-group + .menu-group{border-top:1px solid var(--line)}
.menu-group .eyebrow{padding:6px 12px 6px}
.mi{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2);text-align:left;width:100%}
.mi svg{flex:none;color:var(--muted)}
.mi:hover{background:var(--surface-2)}
.mi.on{background:var(--brand-soft);color:var(--ink)}
.mi.on svg{color:var(--brand)}
.mi .badge{margin-left:auto}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--owe-soft);color:var(--owe)}
.page{min-width:0}
.topbar{position:sticky;top:0;z-index:15;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px, env(safe-area-inset-right,0px)) 8px max(12px, env(safe-area-inset-left,0px))}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:48px}
.topbar .title{flex:1;min-width:0;font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:16}
.content{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:4px 120px;display:flex;flex-direction:column;gap:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px, env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px, env(safe-area-inset-left,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center}
.tab{flex:1;min-height:54px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.tab.on{color:var(--brand)}
.fab{width:56px;height:56px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(14,90,76,.32)}
@media (min-width:1000px){
  .side{transform:none;transition:none}
  .scrim,.menu-btn,.tabbar{display:none!important}
  .page{margin-left:288px}
  .content{padding-bottom:48px}
}

/* buttons */
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.owe{background:var(--owe);color:#fff;border-color:var(--owe)}
.btn.fam{background:var(--fam);color:#fff;border-color:var(--fam)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);min-height:44px;padding:0 8px}
.btn.sm{min-height:40px;font-size:13px;padding:0 12px;border-radius:12px}
.btn.wide{width:100%}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface)}
:root[data-theme="dark"] .btn.owe,:root[data-theme="dark"] .btn.fam{color:#14100C}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.owe, :root:not([data-theme="light"]) .btn.fam{color:#14100C} }

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card.flush{padding:0;gap:0;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero{position:relative;overflow:hidden;background-color:var(--hero);color:var(--hero-fg);border-radius:24px;padding:22px 22px 22px 40px;display:flex;flex-direction:column;gap:16px;
  background-image:linear-gradient(90deg, transparent 22px, var(--margin-line) 22px, var(--margin-line) 24px, transparent 24px), repeating-linear-gradient(180deg, transparent 0 31px, var(--hero-line) 31px 32px)}
.hero .lbl{font-size:13px;color:var(--hero-muted);font-weight:600}
.hero .big{font-family:var(--f-display);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}
.hero .mid{font-family:var(--f-display);font-size:22px;font-weight:700}
.hero .split{height:8px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;overflow:hidden}
.hero .split span{display:block;height:100%}
.tile{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:12px;font-weight:700}
.tile .v{font-family:var(--f-display);font-size:21px;font-weight:700}
.t-get{background:var(--get-soft);color:var(--get)} .t-owe{background:var(--owe-soft);color:var(--owe)} .t-fam{background:var(--fam-soft);color:var(--fam)} .t-inc{background:var(--inc-soft);color:var(--inc)} .t-plain{background:var(--surface-2);color:var(--ink)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.c-get{color:var(--get)} .c-owe{color:var(--owe)} .c-fam{color:var(--fam)} .c-inc{color:var(--inc)} .c-ink{color:var(--ink)} .c-warn{color:var(--warn)} .c-muted{color:var(--muted)}
.banner{border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;font-weight:600}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa{min-height:76px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;cursor:pointer;text-align:left;font-weight:700;font-size:13px;color:var(--ink)}
.qa:hover{border-color:var(--muted)}
.qa i{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 16px;border-bottom:1px solid var(--line);min-height:64px;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.item:last-child{border-bottom:0}
button.item{cursor:pointer;padding-right:16px}
button.item:hover{background:var(--surface-2)}
.item .main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.item .t{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.item .s{font-size:12px;color:var(--muted);font-weight:600;overflow-wrap:anywhere}
.item .amt{font-weight:800;font-size:15px;text-align:right;white-space:nowrap}
.item .end{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.empty{padding:22px 16px;color:var(--muted);font-size:14px;text-align:center}
.av{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;font-family:var(--f-display)}
.av.lg{width:72px;height:72px;border-radius:22px;font-size:26px}
.av.sm{width:32px;height:32px;border-radius:10px;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}

/* forms */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--brand)}
.seg{display:grid;gap:4px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:16px}
.seg button{min-height:44px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field > .lab{font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted);font-weight:600}
.inp{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--surface);font-weight:600;font-size:16px}
.inp:focus{outline:2px solid var(--brand);outline-offset:1px}
.inp.amount{font-family:var(--f-display);font-size:30px;font-weight:700;min-height:64px}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.err{color:var(--warn);font-weight:700;font-size:14px}

/* charts */
.bar{height:10px;border-radius:999px;background:var(--surface-2);display:flex;overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px}
.dv{display:flex;height:10px;width:100%}
.dv > span{flex:1;display:flex}
.dv > span:first-child{justify-content:flex-end;border-right:2px solid var(--muted)}
.dv i{display:block;height:100%}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;height:150px;border-bottom:1px solid var(--line)}
.cols .col{display:flex;justify-content:center;align-items:flex-end;gap:3px;height:140px}
.cols .col span{width:10px;border-radius:4px 4px 0 0;display:block}
.cols-x{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{width:132px;height:132px;border-radius:50%;flex:none;position:relative}
.donut::after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--surface)}

/* toast + lock */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:12px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:800;text-decoration:underline;min-height:36px;cursor:pointer}
@media (min-width:1000px){ .toast{bottom:32px;left:calc(50% + 144px)} }
.lock{position:fixed;inset:0;background:var(--hero);color:var(--hero-fg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:999px;border:2px solid var(--hero-fg);display:block}
.dots i.f{background:var(--hero-fg)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);font-size:26px;font-weight:700;cursor:pointer;color:var(--hero-fg);font-family:var(--f-display)}
.lock .link{border:0;background:transparent;color:var(--hero-muted);font-weight:700;min-height:44px;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion: no-preference){ .btn,.chip,.qa,button.item,.mi{transition:background .15s,border-color .15s} }
@media (prefers-reduced-motion: reduce){ .side{transition:none} }

function mkeyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function curMonth(){ return mkeyOf(new Date()); }
function addMonths(k,n){ var p=k.split('-').map(Number); return mkeyOf(new Date(p[0], p[1]-1+n, 1)); }
function monthLabel(k, short){ var p=k.split('-').map(Number); return new Date(p[0],p[1]-1,1).toLocaleDateString('en-IN', short ? {month:'short'} : {month:'long', year:'numeric'}); }
function pretty(s){ var p=String(s).split('-').map(Number); if(!p[0]) return ''; return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n); return ymd(d); }
function daysDiff(a,b){ return Math.round((Date.parse(b) - Date.parse(a))/86400000); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function initials(n){ return String(n||'?').trim().split(/\s+/).map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase(); }
function lsGet(k){ try{ var r=localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function num(v){ var n=parseFloat(v); return isFinite(n) ? n : 0; }
function same(a,b){ return String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase(); }
function greeting(){ var h=new Date().getHours(); return h<12 ? 'Good morning' : h<17 ? 'Good afternoon' : 'Good evening'; }

function defSettings(){ return { started:false, budgets:{ total:0, family:0, cats:{} }, pinHash:'', lastBackup:'', cats:DEFAULT_CATS.slice() }; }
function mergeSettings(s){
  var d = defSettings(); s = s || {};
  d.started = !!s.started; d.pinHash = s.pinHash || ''; d.lastBackup = s.lastBackup || '';
  var b = s.budgets || {}; d.budgets = { total:num(b.total), family:num(b.family), cats:Object.assign({}, b.cats || {}) };
  if(Array.isArray(s.cats) && s.cats.length) d.cats = s.cats.slice();
  return d;
}

var ui = { screen:'home', back:null, person:null, filter:'all', q:'', pq:'', pfilter:'All', month:curMonth(), form:null, pform:null, toast:null, unlocked:false, pin:'', pinErr:'', confirm:null, lastDeleted:null, drawer:false };

function load(){
  var c = lsGet(KEY);
  if(!c){
    var old = lsGet(OLD_KEY);
    if(old){ c = { tx:old.tx || {}, rules:old.rules || {}, people:{}, settings:old.settings || {} }; var phones = (old.settings && old.settings.phones) || {}; c.phones = phones; }
  }
  if(c){
    S.tx = c.tx || {}; S.rules = c.rules || {}; S.people = c.people || {}; S.settings = mergeSettings(c.settings);
    Object.keys(S.tx).forEach(function(k){ delete S.tx[k]._u; });
    syncPeopleFromTx(c.phones || {});
  }
  decideDemo();
}
function save(){ lsSet(KEY, { tx:S.tx, rules:S.rules, people:S.people, settings:S.settings }); }
function decideDemo(){ S.demo = !S.settings.started && !Object.keys(S.tx).length && !Object.keys(S.rules).length && !Object.keys(S.people).length; }
function leaveDemo(){ if(S.settings.started) return; S.settings.started = true; S.demo = false; }

/* ---------- people ---------- */
function peopleList(){ return S.demo ? demoPeople() : Object.keys(S.people).map(function(k){ return S.people[k]; }); }
function findPerson(name){ var n = String(name||'').trim(); return peopleList().filter(function(p){ return same(p.name, n); })[0] || null; }
function ensurePerson(name, relation){
  var hit = findPerson(name); if(hit) return hit;
  var p = { id:uid(), name:String(name).trim(), relation:relation || 'Friend', phone:'', note:'', created:today() };
  S.people[p.id] = p; return p;
}
function syncPeopleFromTx(phones){
  Object.keys(S.tx).forEach(function(k){
    var t = S.tx[k]; if(!t.person) return;
    var p = ensurePerson(t.person, t.kind === 'family' ? 'Family' : 'Friend');
    if(phones && phones[p.name] && !p.phone) p.phone = phones[p.name];
  });
  Object.keys(S.rules).forEach(function(k){ var r = S.rules[k]; if(r.person) ensurePerson(r.person, r.kind === 'family' ? 'Family' : 'Friend'); });
}
function relClass(rel){ return rel === 'Family' ? 't-fam' : rel === 'Work' ? 't-inc' : rel === 'Other' ? 't-plain' : 't-get'; }

/* ---------- writes ---------- */
function commit(fn){ leaveDemo(); fn(); save(); }
function putTx(t){ commit(function(){ S.tx[t.id] = t; }); }

/* ---------- recurring ---------- */
function runRecurring(){
  if(S.demo) return;
  var cur = curMonth(), day = new Date().getDate(), changed = false;
  Object.keys(S.rules).forEach(function(rid){
    var r = S.rules[rid]; if(r.stopped) return;
    var m = addMonths(r.last, 1), guard = 0;
    while(m <= cur && guard++ < 36){
      if(m === cur && day < r.day) break;
      var id = 'r-' + rid + '-' + m;
      if(!S.tx[id]) S.tx[id] = { id:id, kind:r.kind, amount:r.amount, person:r.person||'', category:r.category||'', source:r.source||'', mode:r.mode, note:r.note||'', date:m+'-'+pad(r.day), rule:rid };
      r.last = m; changed = true; m = addMonths(m, 1);
    }
  });
  if(changed) save();
}

/* ---------- derived ---------- */
function eff(t){ return t.kind==='gave' ? +t.amount : t.kind==='got' ? -t.amount : t.kind==='split' ? +(t.share != null ? t.share : t.amount/2) : 0; }
function balances(list){
  var map = {};
  peopleList().forEach(function(p){ map[p.name.toLowerCase()] = { p:p, name:p.name, bal:0, count:0, last:'', due:'', given:0, late:0 }; });
  list.forEach(function(t){
    if(!t.person) return;
    var k = t.person.toLowerCase(), b = map[k];
    if(!b) b = map[k] = { p:{ id:'', name:t.person, relation:t.kind==='family'?'Family':'Friend', phone:'' }, name:t.person, bal:0, count:0, last:'', due:'', given:0, late:0 };
    b.count++; if(t.date > b.last) b.last = t.date;
    if(FRIEND[t.kind]){ b.bal += eff(t); if(t.due && t.kind !== 'got' && t.due > b.due) b.due = t.due; }
    if(t.kind === 'family') b.given += +t.amount;
  });
  Object.keys(map).forEach(function(k){ var b = map[k]; b.late = (b.bal > 0.5 && b.due && b.due < today()) ? daysDiff(b.due, today()) : 0; });
  return map;
}
function balList(map){ return Object.keys(map).map(function(k){ return map[k]; }); }
function totals(map){ var g=0, p=0; balList(map).forEach(function(b){ if(b.bal>0.5) g+=b.bal; else if(b.bal<-0.5) p-=b.bal; }); return { get:g, pay:p, net:g-p }; }
function byDateDesc(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1); }
function monthStats(list, k){
  var s = { income:0, expense:0, family:0, cats:{}, fam:{}, src:{}, items:[] };
  list.forEach(function(t){
    if(String(t.date).slice(0,7) !== k) return;
    var a = +t.amount;
    if(t.kind==='income'){ s.income += a; s.src[t.source||'Other'] = (s.src[t.source||'Other']||0) + a; }
    else if(t.kind==='expense'){ s.expense += a; s.cats[t.category||'Other'] = (s.cats[t.category||'Other']||0) + a; }
    else if(t.kind==='family'){ s.family += a; s.fam[t.person] = (s.fam[t.person]||0) + a; }
  });
  s.spent = s.expense + s.family; s.saved = s.income - s.spent;
  return s;
}
function balClass(b){ return b > 0.5 ? 'c-get' : b < -0.5 ? 'c-owe' : 'c-muted'; }
function balText(b, name){ return b > 0.5 ? (name ? name + ' owes you' : 'owes you') : b < -0.5 ? (name ? 'You owe ' + name : 'you owe') : 'settled'; }

function txList(list, empty){ return '<div class="card flush">' + (list.length ? list.map(txRow).join('') : '<div class="empty">'+(empty||'Nothing here yet.')+'</div>') + '</div>'; }
function barRow(label, value, max, color, right){
  var w = max > 0 ? Math.max(value > 0 ? 3 : 0, Math.min(100, value / max * 100)) : 0;
  return '<div class="stack" style="gap:6px"><div class="between" style="font-size:13px"><span style="font-weight:700">'+esc(label)+'</span><span class="num" style="font-weight:700">'+right+'</span></div><div class="bar"><span style="width:'+w.toFixed(1)+'%;background:'+color+'"></span></div></div>';
}
function budgetBar(label, spent, budget){
  var pct = budget > 0 ? spent / budget * 100 : 0;
  var color = pct >= 100 ? 'var(--warn)' : pct >= 80 ? 'var(--owe)' : 'var(--brand)';
  var note = pct >= 100 ? 'Over by ' + inr(spent - budget) : pct >= 80 ? inr(budget - spent) + ' left, close to the limit' : inr(budget - spent) + ' left';
  return '<div class="stack" style="gap:6px"><div class="between" style="font-size:13px"><span style="font-weight:700">'+esc(label)+'</span><span class="num" style="font-weight:700">'+inr(spent)+' <span class="muted">of '+inr(budget)+'</span></span></div><div class="bar"><span style="width:'+Math.min(100,pct).toFixed(1)+'%;background:'+color+'"></span></div><span class="hint '+(pct>=100?'c-warn':pct>=80?'c-owe':'')+'">'+note+'</span></div>';
}
function catColor(i){ return 'var(--c' + ((i % 8) + 1) + ')'; }
function donut(entries, total){
  var acc = 0, stops = entries.map(function(e, i){ var a = acc / total * 360, b = (acc + e.v) / total * 360; acc += e.v; return catColor(i) + ' ' + a.toFixed(1) + 'deg ' + b.toFixed(1) + 'deg'; });
  return '<div class="donut" role="img" aria-label="Spending split by category" style="background:conic-gradient(' + (stops.length ? stops.join(',') : 'var(--surface-2) 0 360deg') + ')"></div>';
}
function sixMonths(list, endK, series){
  var months = []; for(var i=5;i>=0;i--){ var mk = addMonths(endK, -i); months.push({ k:mk, s:monthStats(list, mk) }); }
  var max = 1; months.forEach(function(m){ series.forEach(function(se){ max = Math.max(max, m.s[se[0]]); }); });
  var px = function(v){ return v > 0 ? Math.max(3, Math.round(v/max*134)) : 0; };
  return '<div class="legend">' + series.map(function(se){ return '<span><i style="background:'+se[2]+'"></i>'+se[1]+'</span>'; }).join('') + '</div>' +
    '<div class="cols" role="img" aria-label="Six months ending '+esc(monthLabel(endK))+'">' + months.map(function(m){ return '<div class="col">' + series.map(function(se){ return '<span style="height:'+px(m.s[se[0]])+'px;background:'+se[2]+'"></span>'; }).join('') + '</div>'; }).join('') + '</div>' +
    '<div class="cols-x">' + months.map(function(m){ return '<span'+(m.k===endK?' style="color:var(--ink)"':'')+'>'+esc(monthLabel(m.k,true))+'</span>'; }).join('') + '</div>';
}
function personRow(b){
  var sub = esc(b.p.relation || 'Friend');
  if(b.p.relation === 'Family' && b.given) sub += ' · given ' + inr(b.given);
  else if(b.count) sub += ' · ' + b.count + (b.count===1?' entry':' entries');
  else sub += ' · no entries yet';
  var right = Math.abs(b.bal) >= 0.5 ? '<span class="end"><span class="amt num '+balClass(b.bal)+'">'+inr(b.bal)+'</span><span class="hint '+balClass(b.bal)+'">'+balText(b.bal)+'</span></span>' : '';
  return '<button type="button" class="item" data-act="person" data-name="'+esc(b.name)+'">'+avatar(b)+'<span class="main"><span class="t">'+esc(b.name)+(b.late?' <span class="tag t-warn">'+b.late+'d late</span>':'')+'</span><span class="s">'+sub+'</span></span>'+right+'</button>';
}

function vSplits(){
  var list = allTx(), groups = {};
  list.forEach(function(t){
    if(!t.group) return;
    var g = groups[t.group] || (groups[t.group] = { id:t.group, date:t.date, note:'', bill:0, people:[], mine:0 });
    if(t.kind === 'split'){ g.bill = +t.amount; g.people.push({ name:t.person, share:+(t.share != null ? t.share : t.amount/2) }); if(t.note) g.note = t.note; }
    if(t.kind === 'expense') g.mine = +t.amount;
  });
  list.forEach(function(t){ if(t.kind === 'split' && !t.group){ groups['s'+t.id] = { id:'s'+t.id, date:t.date, note:t.note, bill:+t.amount, people:[{ name:t.person, share:+(t.share != null ? t.share : t.amount/2) }], mine:0 }; } });
  var arr = Object.keys(groups).map(function(k){ return groups[k]; }).filter(function(g){ return g.people.length; }).sort(function(a,c){ return a.date < c.date ? 1 : -1; });
  var h = demoBanner() + '<button type="button" class="btn primary" data-act="add" data-kind="split">'+ic('split',18)+'Split a new bill</button>';
  if(!arr.length) return h + '<div class="card"><p class="muted" style="text-align:center">No split bills yet.</p></div>';
  arr.forEach(function(g){
    var others = g.people.reduce(function(a,p){ return a + p.share; }, 0);

function splitCalc(f){
  var total = num(f.amount), sp = f.split, n = sp.people.length, shares = {}, mine = 0, ok = true, msg = '';
  if(sp.type === 'equal'){
    var each = n ? total / (n + (sp.me ? 1 : 0)) : 0;
    sp.people.forEach(function(p){ shares[p] = Math.round(each*100)/100; });
    mine = sp.me ? total - each * n : 0;
    msg = n ? 'Each person pays ' + inr(each) + (sp.me ? ' · your share ' + inr(mine) : '') : 'Pick who was with you.';
  } else {
    var sum = 0; sp.people.forEach(function(p){ var v = num(sp.custom[p]); shares[p] = v; sum += v; });
    mine = total - sum;
    if(mine < -0.5){ ok = false; msg = 'Shares add up to ' + inr(sum) + ', more than the bill.'; }
    else msg = 'Others pay ' + inr(sum) + ' · your share ' + inr(mine);
  }
  return { shares:shares, mine:Math.max(0, mine), ok:ok, msg:msg };
}

function saveForm(){
  var f = ui.form, k = f.kind, amt = num(f.amount), name = String(f.person||'').trim(), note = String(f.note||'').trim(), date = f.date || today();
  if(!(amt > 0)) return formErr('Enter an amount above ₹0.');
  var adds = [], dest = 'home', destPerson = null, newRule = null;
  if(k==='gave' || k==='got'){
    if(!name) return formErr('Enter who this is with.');
    var t = { id:uid(), kind:k, person:name, amount:amt, mode:f.mode, date:date, note:note }; if(k==='gave' && f.due) t.due = f.due;
    adds.push(t); dest = 'person'; destPerson = name;
  } else if(k==='split'){
    var sp = f.split; if(!sp.people.length) return formErr('Pick at least one person who shares the bill.');
    var c = splitCalc(f); if(!c.ok) return formErr(c.msg);
    var g = uid();
    sp.people.forEach(function(p){ if(c.shares[p] > 0) adds.push({ id:uid(), kind:'split', person:p, amount:amt, share:c.shares[p], group:g, mode:f.mode, date:date, note:note }); });
    if(!adds.length) return formErr('Enter each person’s share.');
    if(sp.me && sp.addMine && c.mine > 0.5) adds.push({ id:uid(), kind:'expense', category:sp.myCat, amount:Math.round(c.mine*100)/100, mode:f.mode, date:date, note:(note ? note + ', ' : '') + 'my share of split bill', group:g });

        });
        var ss = wb.Sheets['Settings'];
        if(ss) XLSX.utils.sheet_to_json(ss, { header:1, defval:'' }).slice(1).forEach(function(r){
          var key = String(r[0] || ''), val = r[1], bd = S.settings.budgets;
          if(key === 'Budget: my expenses') bd.total = num(val);
          else if(key === 'Budget: family') bd.family = num(val);
          else if(key === 'Categories'){ var cs = String(val).split(',').map(function(x){ return x.trim(); }).filter(Boolean); if(cs.length) S.settings.cats = cs; }
          else if(key.indexOf('Budget: ') === 0){ var c = key.slice(8); if(num(val) > 0) bd.cats[c] = num(val); else delete bd.cats[c]; }
        });
      });
      runRecurring(); render();
      toast('Imported ' + n + ' entr' + (n === 1 ? 'y' : 'ies') + (np ? ', ' + np + ' people' : '') + (skipped ? ' · ' + skipped + ' rows skipped' : ''));
    }catch(e){ toast('Could not read that file. Use an Excel file exported from Money Diary.'); }
  };
  fr.readAsArrayBuffer(file);
}

/* ---------- events ---------- */
var A = {
  go: function(d){ go(d.to); },
  back: function(){ if(ui.screen === 'personEdit'){ ui.pform = null; } if(ui.screen === 'add'){ ui.form = null; } goBack(); },
  drawer: function(){ ui.drawer = !ui.drawer; renderSide(); renderTop(); if(ui.drawer){ $('#side').scrollTop = 0; var f = $('#side .mi'); if(f) f.focus({ preventScroll:true }); } },
  person: function(d){ ui.person = d.name; go('person'); },
  add: function(d){ ui.form = newForm(d.kind, d.name); go('add', true); },
  newPerson: function(d){ openPersonForm(null, d.rel); },
  editPerson: function(){ var b = currentBal(); if(b && b.p && b.p.id && S.people[b.p.id]) openPersonForm(S.people[b.p.id]); else if(b && !S.demo){ var p; commit(function(){ p = ensurePerson(b.name); }); openPersonForm(p); } },
  prel: function(d){ ui.pform.relation = d.v; render(); },
  savePerson: savePerson,
  deletePerson: function(){
    if(ui.confirm !== 'delp'){ ui.confirm = 'delp'; render(); return; }
    var f = ui.pform; commit(function(){ delete S.people[f.id]; Object.keys(S.tx).forEach(function(k){ if(same(S.tx[k].person, f.orig)) delete S.tx[k]; }); Object.keys(S.rules).forEach(function(k){ if(same(S.rules[k].person, f.orig)) delete S.rules[k]; }); });
    ui.pform = null; ui.confirm = null; stackHist = ['home']; go('people'); toast(f.orig + ' deleted');
  },
  pfilter: function(d){ ui.pfilter = d.v; render(); },
  startEmpty: function(){ commit(function(){}); decideDemo(); render(); toast('Examples cleared'); },
  group: function(d){ var f = ui.form, map = { friends:'gave', expense:'expense', family:'family', income:'income' }, was = FRIEND[f.kind] ? 'friends' : f.kind; f.kind = map[d.v]; if(was !== d.v) f.person = ''; f.err = ''; render(); },
  kind: function(d){ ui.form.kind = d.v; ui.form.err = ''; if(d.v === 'split' && ui.form.person && !ui.form.split.people.length) ui.form.split.people.push(ui.form.person); render(); },
  pickName: function(d){ ui.form.person = d.v; ui.form.err = ''; render(); },
  pickCat: function(d){ ui.form.category = d.v; render(); },
  pickSource: function(d){ ui.form.source = d.v; render(); },
  pickMode: function(d){ ui.form.mode = d.v; render(); },
  pickMyCat: function(d){ ui.form.split.myCat = d.v; render(); },
  togglePerson: function(d){ var a = ui.form.split.people, i = -1; a.forEach(function(p, j){ if(same(p, d.v)) i = j; }); if(i >= 0) a.splice(i,1); else a.push(d.v); ui.form.err = ''; render(); },
  addSplitName: function(){ var el = $('#f-newname'), n = el ? el.value.trim() : ''; if(!n) return; var a = ui.form.split.people; if(!a.some(function(x){ return same(x,n); })) a.push(n); render(); var nx = $('#f-newname'); if(nx) nx.focus(); },
  splitType: function(d){ ui.form.split.type = d.v; render(); },
  save: saveForm,
  del: function(d){ var t = S.tx[d.id]; if(!t) return; ui.lastDeleted = t; commit(function(){ delete S.tx[d.id]; }); render(); toast('Entry deleted', true); },
  undo: function(){ var t = ui.lastDeleted; if(!t) return; ui.lastDeleted = null; commit(function(){ S.tx[t.id] = t; }); ui.toast = null; render(); },
  settle: function(d){
    var key = 'settle:' + d.name; if(ui.confirm !== key){ ui.confirm = key; render(); return; }
    ui.confirm = null; var b = balances(allTx())[d.name.toLowerCase()];
    if(!b || Math.abs(b.bal) < 0.5){ toast('Already settled'); render(); return; }
    putTx({ id:uid(), kind: b.bal > 0 ? 'got' : 'gave', person:b.name, amount:Math.round(Math.abs(b.bal)*100)/100, mode:'Cash', date:today(), note:'Settled up' });
    toast('Settled up with ' + d.name); render();
  },
  copyMsg: function(){ var t = $('#msg'); if(!t) return; try{ navigator.clipboard.writeText(t.value).then(function(){ toast('Message copied'); }, function(){ t.select(); toast('Select and copy the message'); }); }catch(e){ t.select(); } },
  filter: function(d){ ui.filter = d.f; render(); },
  month: function(d){ var m = addMonths(ui.month, +d.d); if(m > curMonth()) return; ui.month = m; render(); },
  exportXlsx: exportXlsx,
  import: function(){ $('#importFile').click(); },
  saveBudget: function(){ commit(function(){ var b = { total:num(($('#b-total')||{}).value), family:num(($('#b-family')||{}).value), cats:{} }; document.querySelectorAll('[data-bcat]').forEach(function(el){ var v = num(el.value); if(v > 0) b.cats[el.dataset.bcat] = v; }); S.settings.budgets = b; }); toast('Budgets saved'); render(); },
  stopRule: function(d){ var key = 'rule:' + d.id; if(ui.confirm !== key){ ui.confirm = key; render(); return; } ui.confirm = null; commit(function(){ S.rules[d.id].stopped = true; }); toast('Stopped. Past entries stay.'); render(); },
  theme: function(d){ lsSet(THEME_KEY, d.v); applyTheme(); render(); },
  addCat: function(){ var el = $('#newcat'), v = el ? el.value.trim() : ''; if(!v) return; if(S.settings.cats.some(function(c){ return same(c, v); })){ toast(v + ' is already there'); return; } commit(function(){ S.settings.cats.push(v); }); render(); },
  removeCat: function(d){ if(S.settings.cats.length <= 1) return; commit(function(){ S.settings.cats = S.settings.cats.filter(function(c){ return c !== d.v; }); }); toast(d.v + ' removed'); render(); },
  setPin: async function(){ var a = ($('#p1')||{}).value || '', b = ($('#p2')||{}).value || ''; if(!/^\d{4}$/.test(a)){ toast('Use exactly 4 digits.'); return; } if(a !== b){ toast('The two PINs do not match.'); return; } S.settings.pinHash = await hashPin(a); ui.unlocked = true; save(); toast('PIN turned on'); render(); },
  removePin: function(){ if(ui.confirm !== 'pin'){ ui.confirm = 'pin'; render(); return; } ui.confirm = null; S.settings.pinHash = ''; save(); toast('PIN removed'); render(); },
  clearAll: function(){ if(ui.confirm !== 'clear'){ ui.confirm = 'clear'; render(); return; } ui.confirm = null; commit(function(){ S.tx = {}; S.rules = {}; S.people = {}; }); stackHist = []; toast('All data deleted'); go('home'); },
  pinKey: async function(d){
    if(d.v === '⌫'){ ui.pin = ui.pin.slice(0,-1); renderLock(); return; }
    if(ui.pin.length >= 4) return; ui.pin += d.v; ui.pinErr = ''; renderLock();
    if(ui.pin.length === 4){ var h = await hashPin(ui.pin); if(h === S.settings.pinHash){ ui.unlocked = true; ui.pin = ''; render(); } else { ui.pin = ''; ui.pinErr = 'Wrong PIN. Try again.'; renderLock(); } }
  },
  forgotPin: function(){
    if(ui.confirm !== 'forgot'){ ui.confirm = 'forgot'; renderLock(); return; }
    ui.confirm = null; S.tx = {}; S.rules = {}; S.people = {}; S.settings = defSettings(); S.settings.started = true; _save(); save(); decideDemo(); ui.unlocked = true; ui.pin = ''; render();
    if(D.connected){ toast('Erased on this phone. Getting your data back from Google Drive…'); driveSync(true); } else toast('Erased. Import your Excel backup from Backup & restore.');
  },
  driveConnect: function(){ driveSync(true); },
  syncNow: function(){ driveSync(true); },
  driveDisconnect: function(){
    if(ui.confirm !== 'drive'){ ui.confirm = 'drive'; render(); return; }
    ui.confirm = null; try{ if(D.token && window.google && google.accounts) google.accounts.oauth2.revoke(D.token, function(){}); }catch(e){}
    D.connected = false; D.token = ''; D.exp = 0; D.fileId = ''; saveD(); setDS('off'); render(); toast('Drive disconnected. Your data stays on this phone.');
  }
};
document.addEventListener('click', function(e){
  if(e.target.id === 'scrim'){ ui.drawer = false; renderSide(); renderTop(); return; }
  var el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  var fn = A[el.dataset.act]; if(!fn) return;
  if(el.tagName !== 'A') e.preventDefault();
  fn(el.dataset, el);
});
document.addEventListener('input', function(e){
  var el = e.target;
  if(el.id === 'q'){ ui.q = el.value; var hl = $('#hist'); if(hl) hl.innerHTML = historyList(); return; }
  if(el.id === 'pq'){ ui.pq = el.value; var pl = $('#plist'); if(pl) pl.innerHTML = peopleListHTML(balList(balances(allTx())), ui.pq.trim().toLowerCase(), ui.pfilter); return; }
  if(el.dataset.pf && ui.pform){ ui.pform[el.dataset.pf] = el.value; return; }
  if(!ui.form) return;
  if(el.dataset.f){ ui.form[el.dataset.f] = el.value; if(el.dataset.f === 'person'){ var pk = $('#pick'); if(pk) pk.innerHTML = pickChips(); } }
  else if(el.dataset.cust){ ui.form.split.custom[el.dataset.cust] = el.value; }
  if(ui.form.kind === 'split'){ var pv = $('#split-prev'); if(pv) pv.textContent = splitCalc(ui.form).msg; }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if(el.id === 'importFile'){ if(el.files && el.files[0]) importXlsx(el.files[0]); el.value = ''; return; }
  if(el.dataset.fc && ui.form){ var p = el.dataset.fc.split('.'); if(p.length === 2) ui.form[p[0]][p[1]] = el.checked; else ui.form[p[0]] = el.checked; render(); }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && ui.drawer){ ui.drawer = false; renderSide(); renderTop(); return; }
  if(e.key === 'Enter' && e.target.id === 'f-newname'){ e.preventDefault(); A.addSplitName(); }
  if(e.key === 'Enter' && e.target.id === 'newcat'){ e.preventDefault(); A.addCat(); }
  if(!$('#lock').innerHTML) return;
  if(/^\d$/.test(e.key)) A.pinKey({ v:e.key }); else if(e.key === 'Backspace') A.pinKey({ v:'⌫' });
});
window.addEventListener('online', function(){ driveSync(false); });
window.addEventListener('offline', function(){ if(D.connected) setDS('offline'); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden) driveSync(false); });

/* ---------- start ---------- */
applyTheme(); load(); loadTomb(); runRecurring();
(function(){ try{ var qp = new URLSearchParams(location.search), to = qp.get('go'), add = qp.get('add'); if(add && TYPE_NAMES[add]){ ui.form = newForm(add); ui.screen = 'add'; } else if(to && VIEWS[to] && to !== 'person' && to !== 'personEdit' && to !== 'add'){ ui.screen = to; } if(add || to) history.replaceState(null, '', location.pathname); }catch(e){} })();
render(); driveSync(false);
})();

</script>

if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
